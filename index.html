<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웅천 야자 도장판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --night:#1F3B2D;--night-2:#152A20;--paper:#FAF7EE;--paper-2:#EFEADB;--card:#FFFEF9;
  --ink:#2B2320;--muted:#6F6253;--line:rgba(43,35,32,.16);
  --gold:#8E6C1C;--gold-soft:#FAF0D2;--gold-line:#D9B65C;
  --seal:#B23A26;--seal-soft:rgba(178,58,38,.08);--ok:#2F6B3A;
  --r:14px;
  --title:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --sans:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--title);font-weight:400;margin:0;line-height:1.3}
p{margin:0}

.demo{background:#FFF3C9;border-bottom:1px solid var(--gold-line);padding:7px 16px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.demo select{width:auto;min-height:0;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff}

/* 머리 */
.top{background:linear-gradient(180deg,var(--night-2),var(--night));color:#F7F1E3;padding:12px 16px 10px}
.emblem{width:42px;height:auto;flex:none;display:block}
.emblem.big{width:76px;margin:2px auto 8px}
/* 웅천읍성 성가퀴: 머리 아래로 성벽 윤곽 */
.wall{height:9px;background:repeating-linear-gradient(90deg,var(--paper) 0 16px,var(--night) 16px 30px)}
.motto{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.14em;margin-top:14px}
.motto b{font-family:var(--title);font-weight:400;color:var(--night);font-size:15px;letter-spacing:.2em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper-2);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:44px;padding:6px}
.seg button[aria-pressed=true]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
/* 지금 구경 시간인지 도장 시간인지 */
.timebar{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--night);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.timebar b{display:block;font-family:var(--title);font-weight:400;font-size:18px;line-height:1.35}
.timebar.on{background:var(--gold-soft);border-color:var(--gold-line);border-left-color:var(--gold)}
table.times{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.times th{font-weight:600;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);font-size:12.5px}
table.times td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.times tr:last-child td{border-bottom:0}
table.times tr.now td{background:var(--gold-soft);font-weight:600}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mark{min-width:0;flex:1}
.mark small{display:block;font-size:12px;letter-spacing:.04em;opacity:.72}
.mark b{display:block;font-family:var(--title);font-weight:400;font-size:23px;line-height:1.25}
.who{font-size:13px;text-align:right;line-height:1.4;flex:none}
.who b{display:block;font-size:15px;font-weight:600}
.who span{opacity:.75}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}

/* 탭 */
.tabs{background:var(--night);padding:0 16px;border-top:1px solid rgba(217,182,92,.25)}
.tabs-in{max-width:760px;margin:0 auto;display:flex;gap:2px;overflow-x:auto}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:#D8D2C2;padding:9px 12px;min-height:44px}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:var(--gold-line);font-weight:600}

/* 칸 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:20px}
.head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.head .end{margin-left:auto;font-size:13.5px;color:var(--muted)}
.hint{font-size:13.5px;color:var(--muted)}
.btn{background:var(--night);color:#fff;border:0;border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.sm{min-height:36px;padding:5px 12px;font-size:14px}
.btn.gold{background:var(--gold);color:#fff}
.linkbtn{background:none;border:0;padding:10px 4px;color:var(--muted);text-decoration:underline;font-size:14px;min-height:44px}
input[type=text],input[type=password],input[type=search],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:44px}
label.f{display:block;margin-bottom:12px;font-size:14px;font-weight:600}
label.f input{margin-top:5px;font-weight:400}

/* 로그인 */
.login{max-width:400px;margin:0 auto;padding:20px 16px 40px}
.login>.seal{display:block;width:70px;height:70px;margin:2px auto 12px;transform:rotate(-7deg)}
.err{background:var(--seal-soft);color:#8E2D1C;border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:12px}
.note{background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:12px}
.agree{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.agree label{display:flex;gap:8px;align-items:center;font-weight:600;margin-top:8px;min-height:32px}
.agree input{width:20px;height:20px;flex:none}
.agree h3{font-size:18px;margin-bottom:6px}
.agreebox{border-top:1px solid var(--line);padding:9px 0 3px;margin-top:6px}
.agreebox b{display:block;font-size:14px}
.agreebox p{font-size:13px;color:var(--muted);line-height:1.5}
/* 읍성 그림과 디데이 */
.hero{position:relative;background:var(--night);line-height:0;overflow:hidden}
.hero.day{background:#fefefe}.hero.sunset{background:linear-gradient(180deg,#e89a62,#c08a70)}.hero.night{background:#00102a}
/* 블록 그림은 위아래가 잘리지 않게 통째로 보여 준다. 넓은 화면에서 남는 옆은 그림 바탕색으로 채운다. 그림 파일도 양옆을 바탕색으로 늘려 폰 너비(약 4:3)에 맞춰 두었다 */
.hero img{display:block;width:100%;height:auto;aspect-ratio:860/640;max-height:clamp(290px,40vw,400px);object-fit:contain;margin:0 auto}
.dday{position:absolute;left:12px;top:12px;background:rgba(21,42,32,.88);color:#fff;border:1px solid var(--gold-line);border-radius:12px;padding:6px 12px;text-align:center;line-height:1.2}
.dday b{display:block;font-family:var(--title);font-weight:400;font-size:24px;color:#FFE08A}
.dday span{font-size:11.5px}
/* 웅이 */
.woong{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px}
.woong .bear{width:66px;flex:none}
.woong .bear svg{display:block;width:100%;height:auto;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.woong .bubble{position:relative;flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.5;margin-bottom:8px}
.woong .bubble::before{content:"";position:absolute;left:-7px;bottom:14px;width:12px;height:12px;background:var(--card);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.woong .bubble b{display:block;font-family:var(--title);font-weight:400;font-size:18px;line-height:1.35}
.woong.on .bubble,.woong.on .bubble::before{background:var(--gold-soft);border-color:var(--gold-line)}
.woong.done .bubble,.woong.done .bubble::before{background:#FBEEE8;border-color:rgba(178,58,38,.3)}
.woong.done .bubble b{color:#8E2D1C}
/* 오늘의 문구 */
.saying{border-left:4px solid var(--gold-line);padding:2px 0 2px 12px;margin:0 0 14px}
.saying b{display:block;font-family:var(--title);font-weight:400;font-size:17px;line-height:1.45;color:var(--night)}
.saying small{font-size:12px;color:var(--muted)}
.saying .greet{display:block;font-size:13px;font-weight:700;color:var(--gold-ink,#8a6a1f);margin-bottom:2px}

/* 도장 */
.seal{width:100%;height:100%;display:block}
.seal text{font-family:var(--title);fill:var(--seal)}
@keyframes stampIn{0%{transform:scale(2) rotate(-24deg);opacity:0}55%{transform:scale(.9) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-7deg);opacity:1}}

/* 학생 도장판: 월~목 × 교시 */
.done-banner{background:var(--seal-soft);border:1px solid rgba(178,58,38,.25);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.done-banner b{display:block;font-family:var(--title);font-weight:400;font-size:20px;line-height:1.35;color:#8E2D1C}
table.board{width:100%;border-collapse:separate;border-spacing:0 4px;table-layout:fixed}
table.board th{font-weight:400;padding:0}
table.board thead th{font-family:var(--title);font-size:16px;line-height:1.2;padding-bottom:2px}
table.board thead th small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--muted)}
table.board thead th.today{color:var(--gold)}
table.board .lab{width:80px;text-align:left;font-size:13px;line-height:1.25}
table.board .lab b{display:block;font-family:var(--title);font-weight:400;font-size:15.5px}
table.board .lab small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
table.board td{padding:0 2px;text-align:center}
td.today{background:var(--gold-soft)}
table.board td.today:last-child{border-radius:0}
.ring{display:block;position:relative;aspect-ratio:1;border-radius:50%;margin:3px auto;max-width:44px}
.ring.empty{background:var(--paper-2);transform:scale(.3)}
.ring.plan{border:2px dashed rgba(43,35,32,.32)}
.ring.miss{border:2px dashed rgba(178,58,38,.5)}
.ring.rest{background:transparent}
.ring .seal{transform:rotate(-7deg)}
.ring.new .seal{animation:stampIn .6s cubic-bezier(.2,1.5,.4,1) both}
.legend{font-size:12.5px;color:var(--muted);margin-top:8px}
/* 도장 아래 이름. 2개짜리 교시는 도장이 겹쳐 찍힌다 */
.seals{display:flex;justify-content:center;align-items:center}
.seals .seal{width:44px;height:44px;flex:none;transform:rotate(-7deg)}
.seals.two .seal{width:36px;height:36px}
.seals.two .seal+.seal{margin-left:-15px;transform:rotate(7deg)}
.stampcell{display:block;padding:3px 0 1px}
.stampcell.new .seal{animation:stampIn .6s cubic-bezier(.2,1.5,.4,1) both}
.sname{display:block;font-size:11px;font-weight:700;line-height:1.25;color:#8E2D1C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 별 */
.stars{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stars .big{font-family:var(--title);font-size:26px;line-height:1.1}
.stars svg{width:24px;height:24px;flex:none}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-bottom:6px}
.track i{height:12px;border-radius:4px;background:var(--paper-2);display:block}
.track i.on{background:var(--seal)}
.track i.goal{box-shadow:inset 0 0 0 2px var(--gold-line)}
.gift{background:linear-gradient(90deg,#FFF3C9,#FDE7B5);border:1px solid var(--gold-line);border-radius:12px;padding:12px 14px;margin-top:12px}
.gift b{font-family:var(--title);font-weight:400;font-size:19px;display:block;line-height:1.35}
.gift span{font-size:13.5px}

/* 지난 기록 */
details.hist summary{cursor:pointer;font-family:var(--title);font-size:18px;min-height:32px;list-style-position:inside}
.hrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hrow:first-child{border-top:0}
.hrow .wk{flex:1;min-width:0;line-height:1.3}
.hrow .wk small{display:block;font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px;flex:none}
.dots span{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);font-size:12px;line-height:24px;text-align:center;color:var(--muted)}
.dots span.on{background:var(--seal);border-color:var(--seal);color:#fff}
/* 명단 고치기 */
.rh{font-family:var(--title);font-weight:400;font-size:17px;margin:4px 0 6px}
.pcg{display:grid;grid-template-columns:26px repeat(3,1fr);gap:5px;margin:8px 0;align-items:center}
.pcg .pch{font-size:12px;color:var(--muted);text-align:center}.pcg .pcd{font-size:14px;font-weight:700;text-align:center}
.pcg button{min-height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;color:var(--ink);cursor:pointer}
.pcg button[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff;font-weight:700}
.rp{display:block;margin-top:3px;font-size:13px;color:var(--ink);line-height:1.5}
.rrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}.rrow:first-child{border-top:0}
.rinfo{flex:1;min-width:0}.rbtn{display:flex;flex-direction:column;gap:4px;flex:none}.rbtn .btn{min-width:64px}
.tabs.many button{font-size:12.5px;letter-spacing:-.02em;white-space:nowrap;padding-left:2px;padding-right:2px}
.rosc{border-top:1px solid var(--line);padding:10px 0}.rosc:first-child{border-top:0}
/* 학년 색 = 체육복 색(1학년 빨강, 2학년 노랑). 성벽 돌과 달력 칸을 이 색으로 채운다 */
.stu{--b1:#F4B9B1;--b2:#E57868;--b3:#C9372C;--b4:#9C1F16;--bedge:#6E140E;--bempty:#DED5C3}
.stu.g2{--b1:#FCE9A6;--b2:#F8D55A;--b3:#F2B705;--b4:#D69A00;--bedge:#8A6200}
.gcolor{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--b4);vertical-align:-1px;margin-right:4px;border:1px solid var(--bedge)}
/* 웅천읍성 쌓기 */
.castle .cbig{display:flex;align-items:baseline;gap:6px;margin:2px 0 6px}
.castle .cbig b{font-family:var(--title);font-weight:400;font-size:34px;color:var(--night);line-height:1}
.castle .cbig small{color:var(--muted);font-size:13px}
.cbar{height:12px;border-radius:6px;background:var(--bempty);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--b3);border-radius:6px;transition:width .9s ease-out}
.csteps{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.csteps span{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.csteps span.done{background:var(--night);border-color:var(--night);color:#fff}
.csteps span.cur{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold);font-weight:700}
.bricks{display:flex;flex-wrap:wrap-reverse;gap:3px;max-height:170px;overflow:hidden;margin-top:6px;padding:7px;background:#fff;border:1px solid var(--line);border-radius:8px}
.bricks i{width:calc((100% - 27px)/10);height:13px;border-radius:2px;background:var(--bempty)}
.bricks i.on{background:var(--b3);box-shadow:inset 0 -3px 0 var(--b4)}
.bricks i.on.new{background:var(--b4);box-shadow:0 0 0 2px var(--bedge)}
.bricks i:nth-child(20n+1){margin-left:0}
/* 학기 도장 달력 */
.cal{display:grid;gap:3px;font-size:11px;color:var(--muted);align-items:center}
.cal .ml{white-space:nowrap;font-size:10px;min-height:12px}
.cal{max-width:460px}
.cc{aspect-ratio:1;border-radius:4px;background:var(--bempty,#DED5C3)}
.cc.f{background:transparent;border:1px dashed var(--line)}
.cc.o{background:repeating-linear-gradient(45deg,var(--bempty,#DED5C3),var(--bempty,#DED5C3) 3px,#fff 3px,#fff 6px)}
.cc.l1{background:var(--b1)}.cc.l2{background:var(--b2)}.cc.l3{background:var(--b3)}.cc.l4{background:var(--b4);box-shadow:inset 0 0 0 1px var(--bedge)}
.cc.t{outline:2px solid var(--night);outline-offset:1px}
.calkey{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.calkey .cc{width:12px;height:12px;aspect-ratio:auto;display:inline-block}

/* 선생님: 고르기 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;min-height:38px;font-size:14px}
.chip[aria-pressed=true]{background:var(--night);border-color:var(--night);color:#fff;font-weight:600}
.chip small{opacity:.7;font-size:12px;margin-left:4px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.bar .wkn{font-family:var(--title);font-size:18px}
.arrow{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.arrow:disabled{opacity:.35;cursor:default}
.saving{font-size:13px;color:var(--gold);font-weight:600}
.bar .end{margin-left:auto}
.daytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--paper-2);border-radius:12px;padding:4px;margin-bottom:10px}
.daytabs button{border:0;background:transparent;border-radius:9px;min-height:50px;padding:4px;line-height:1.2}
.daytabs button b{display:block;font-family:var(--title);font-weight:400;font-size:18px}
.daytabs button small{font-size:11.5px;color:var(--muted)}
.daytabs button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.daytabs button.today b{color:var(--gold)}

/* 선생님: 교시 표 */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
table.book{width:100%;border-collapse:collapse;table-layout:fixed}
table.book th,table.book td{border-bottom:1px solid var(--line);padding:0;text-align:center}
table.book thead th{background:var(--night);color:#F7F1E3;font-weight:400;padding:6px 0;position:sticky;top:0;z-index:1}
table.book thead th b{display:block;font-family:var(--title);font-weight:400;font-size:16px;line-height:1.2}
table.book thead th small{display:block;font-size:10.5px;opacity:.88;line-height:1.3;white-space:nowrap}
table.book .no{width:30px;font-size:12.5px;color:var(--muted)}
table.book thead .no,table.book thead .nm{color:#F7F1E3;font-size:12px;white-space:nowrap}
table.book thead .no{font-size:11px}
table.book .nm{width:auto;text-align:left;padding:4px 4px 4px 2px;min-width:0}
table.book td.nm b{display:block;font-weight:600;font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.book td.nm small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
table.book .col{width:20%}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:92px;margin:0 auto;height:56px;background:none;border:0;padding:2px}
.cell .sname{display:block;max-width:100%;font-size:10.5px;line-height:1.15;color:#8a2d1d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.sname.by-t{color:#1d3a2c;white-space:normal;word-break:keep-all;font-size:10.5px;line-height:1.15}
.cell .sname.by-t{white-space:nowrap}
.cell .dot{width:7px;height:7px;background:rgba(43,35,32,.2);border-radius:50%;display:block}

  /* ── 도장 → 별 → 상품권 ──
     도장을 찍을 때 그 교시 도장 수를 줄에 적어 둔다. 나중에 설정을 바꿔도 이미 찍은 도장 수는 그대로다 */
  function tallyAll(){
    var star=starN(),thisWk=weekOf(today()),per={},pu={},pn={},pw={};
    live("도장").forEach(function(r){
      var h=S(r["학번"]);(per[h]=per[h]||[]).push({d:dayOf(r),p:Number(r["교시"])||0,n:Number(r["개수"])||0});
    });
    live("지급").forEach(function(r){
      var h=S(r["학번"]),st=Number(r["별"])||0;

      if(weekOf(S(r["시각"]).slice(0,10))===thisWk)pw[h]=(pw[h]||0)+st;
    });
    /* 날짜 순서로 도장을 쌓아, 별 기준을 넘긴 도장이 찍힌 주를 그 별의 주로 본다.
       이번 주에 생긴 별만 받을 수 있다. 월요일 0시가 되면 지난주 별은 사라지지만 도장 수와 남은 자투리는 이어진다 */

    };
  }

  /* 학생 화면 맨 위 안내: 지금 도장을 찍을 수 있는 시간인지 */

  /* 웅천읍성 쌓기: 모은 도장(전체 기간) 수로 단계가 오른다 */
  var STAGES=[[0,"터 닦기"],[10,"주춧돌"],[30,"성벽"],[60,"성가퀴"],[100,"견룡문"],[150,"웅천읍성"]];

  }
  /* 학기 도장 달력: 도장판을 처음 쓴 주부터 이번 주(시험이 다가오면 시험 전 주)까지, 최대 20주 */
  function calendarOf(daily){
    var td=today(),wk=weekOf(td),first=wk;
    live("도장").forEach(function(r){var w=weekOf(dayOf(r));if(w&&w<first)first=w;});
    var end=wk,dd=ddayInfo();

    var list=[];for(var w=first;w<=end;w=addDays(w,7))list.push(w);

      weekN:cur.n,history:history,tally:T0,stage:stageOf(T0.stamps),cal:calendarOf(daily),dayMax:schedule().reduce(function(s,x){return s+x.n;},0)};

  /* QR로 들어온 학생: 그 교시 도장이 찍히고 자기 도장판이 열린다 */

  /* ── 선생님 화면 ──

function put(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function del(k){try{localStorage.removeItem(k);}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function won(n){return Number(n||0).toLocaleString("ko-KR")+"원";}
function md(y){var m=/^\d{4}-(\d{2})-(\d{2})/.exec(y||"");return m?Number(m[1])+"/"+Number(m[2]):"";}
function wkLabel(y){var m=/^\d{4}-(\d{2})-(\d{2})/.exec(y||"");return m?Number(m[1])+"월 "+Number(m[2])+"일 주":"";}
function addDays(y,n){var a=y.split("-").map(Number),t=new Date(Date.UTC(a[0],a[1]-1,a[2]+n));return t.getUTCFullYear()+"-"+("0"+(t.getUTCMonth()+1)).slice(-2)+"-"+("0"+t.getUTCDate()).slice(-2);}
var toastT=null;
function toast(m){var t=el("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on");},3200);}
/* 이 폰을 가리키는 값. 한 폰으로 여러 학생이 찍지 못하게 할 때 쓴다 */
function deviceId(){
  if(App.dev)return App.dev;
  var d=get(K_DEV);
  if(!d){d=Date.now().toString(36)+Math.random().toString(36).slice(2,12);put(K_DEV,d);}
  return d;
}

/* 도장 찍기는 사람이 몰리면 서버가 잠깐 바쁠 수 있어, 두 번까지 저절로 다시 보낸다 */
function call(name,p,tries){
  tries=tries||0;
  if(name==="checkin"&&tries<2){
    return call0(name,p).catch(function(e){
      if(e.kind||!/lock|잠금|too many|busy|연결이 끊겼/i.test(e.message))throw e;
      return new Promise(function(r){setTimeout(r,700+Math.random()*1800);}).then(function(){return call(name,p,tries+1);});
    });
  }
  return call0(name,p);
}
function call0(name,p){
  p=p||{};
  return new Promise(function(res,rej){
    function done(o){
      if(o&&o.error){
        var m=String(o.error),e=new Error(m.replace(/^(LOGIN|QR|GEO):/,""));
        e.kind=/^LOGIN:/.test(m)?"login":/^QR:/.test(m)?"qr":/^GEO:/.test(m)?"geo":"";
        rej(e);
      }else res(o);
    }
    if(window.google&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(function(s){done(JSON.parse(s));})
        .withFailureHandler(function(){rej(new Error("연결이 끊겼어요. 잠시 뒤 다시 해 주세요."));}).api(name,JSON.stringify(p));
    }else if(window.DemoServer){
      setTimeout(function(){done(DemoServer.api(name,JSON.parse(JSON.stringify(p))));},160);
    }else rej(new Error("서버에 연결하지 못했어요."));
  });
}
var NEVER=new Promise(function(){});
/* 선생님 요청 */
function tcall(name,p){
  p=p||{};p.token=App.tch;
  return call(name,p).catch(function(e){
    if(e.kind==="login"){logoutTeacher(e.message);return NEVER;}
    throw e;
  });
}
/* 학생 요청: 토큰과 QR 통행증을 함께 보낸다 */
function scall(name,p){
  p=p||{};p.token=App.stu;p.pass=App.pass;
  return call(name,p).catch(function(e){
    if(e.kind==="login"){App.stu=null;del(K_STU);App.login={who:"student",step:"id"};rLogin(e.message);return NEVER;}
    if(e.kind==="qr"){App.pass=null;App.warn=e.message;bootPlain();return NEVER;}
    throw e;
  });
}

function seal(){
  /* 교화 국화: 꽃잎 18장을 두른 도장 */
  var petals="";
  for(var i=0;i<18;i++){var a=i*Math.PI/9;petals+='<circle cx="'+(32+26.6*Math.cos(a)).toFixed(1)+'" cy="'+(32+26.6*Math.sin(a)).toFixed(1)+'" r="5"/>';}
  return '<svg class="seal" viewBox="0 0 64 64" aria-hidden="true"><g fill="#B23A26">'+petals+'</g><circle cx="32" cy="32" r="26" fill="#FFFEF9"/><circle cx="32" cy="32" r="23.6" fill="none" stroke="#B23A26" stroke-width="1.4"/>'+
    '<text x="32" y="28" text-anchor="middle" font-size="9.5">웅천</text><text x="32" y="45" text-anchor="middle" font-size="17">성실</text></svg>';
}
function seals(n){var out="",m=Math.min(n||1,2);for(var i=0;i<m;i++)out+=seal();return '<span class="seals'+(m>1?" two":"")+'">'+out+'</span>';}

/* ── 로그인: 학생은 언제든 구경하러, QR을 찍었으면 로그인 뒤 바로 도장 ── */
function rLogin(err){
  var L=App.login,isT=L.who==="teacher",body="";
  var E=err?'<div class="err" role="alert">'+esc(err)+'</div>':"";
  if(L.step==="id"){
    body=isT?
      '<label class="f">선생님 이름<input type="text" id="l-name" autocomplete="off" value="'+esc(L.name||"")+'" placeholder="예: 홍길동"></label>':
      '<label class="f">학번<input type="text" id="l-hb" inputmode="numeric" maxlength="4" autocomplete="off" value="'+esc(L.hakbun||"")+'" placeholder="예: 1203"></label>'+
      '<label class="f">이름<input type="text" id="l-name" autocomplete="off" value="'+esc(L.name||"")+'"></label>';
    body+='<button class="btn" style="width:100%">다음</button>';
  }else if(L.step==="pin"){
    body='<p style="margin-bottom:12px"><b>'+esc(L.name)+'</b>'+(isT?" 선생님":"")+', PIN을 넣어 주세요.</p>'+
      '<label class="f">PIN 여섯 자리<input type="password" id="l-pin" inputmode="numeric" maxlength="6" autocomplete="off"></label>'+
      '<button class="btn" style="width:100%">들어가기</button>'+
      '<p class="hint" style="margin-top:10px">PIN을 잊었으면 담당 선생님께 초기화를 부탁해 주세요.</p>';
  }else if(L.step==="setup"){
    var ag=L.ag||{},box=function(id,title,text){return '<div class="agreebox"><b>'+title+'</b><p>'+esc(text)+'</p><label><input type="checkbox" id="'+id+'"'+(ag[id]?" checked":"")+'> 동의합니다</label></div>';};
    body='<p style="margin-bottom:10px"><b>'+esc(L.name)+'</b>, 처음이네요. 내용을 읽고 동의해 주세요.</p>'+
      '<div class="agree"><h3>개인정보·위치·기기 동의서</h3>'+
      '<button type="button" class="btn ghost sm" data-a="agree-all">모두 동의합니다</button>'+
      box("l-a1","① 개인정보 수집·이용 (필수)",App.conf.privacy)+box("l-a2","② 위치 정보 이용 (필수)",App.conf.privacyGeo)+box("l-a3","③ 기기 등록 (필수)",App.conf.privacyDev)+
      '<p class="hint" style="margin-top:8px">동의하지 않을 수 있어요. 그러면 이 앱을 쓸 수 없지만, 참여 확인은 선생님께 부탁할 수 있어요. 동의를 철회하려면 담당 선생님께 말씀해 주세요.</p></div>'+
      '<label class="f">쓸 PIN 여섯 자리<input type="password" id="l-pin" inputmode="numeric" maxlength="6" autocomplete="off"></label>'+
      '<label class="f">한 번 더<input type="password" id="l-pin2" inputmode="numeric" maxlength="6" autocomplete="off"></label>'+
      '<button class="btn" style="width:100%">시작하기</button>'+
      '<p class="hint" style="margin-top:10px">PIN은 친구에게 알려 주지 마세요.</p>';
  }else if(L.step==="code"){
    body='<p style="margin-bottom:10px"><b>'+esc(L.name)+'</b> 선생님, 처음 한 번만 코드와 PIN을 정해 주세요.</p>'+
      '<label class="f">선생님 코드<input type="text" id="l-code" autocomplete="off" autocapitalize="characters"></label>'+
      '<label class="f">쓸 PIN 여섯 자리<input type="password" id="l-pin" inputmode="numeric" maxlength="6" autocomplete="off"></label>'+
      '<label class="f">한 번 더<input type="password" id="l-pin2" inputmode="numeric" maxlength="6" autocomplete="off"></label>'+
      '<button class="btn" style="width:100%">등록하기</button>'+
      '<p class="hint" style="margin-top:10px">학년별 코드는 담당 선생님께 받아 주세요.</p>';
  }
  var back=L.step==="id"?"":'<button type="button" class="linkbtn" data-a="login-back" style="display:block;margin:6px auto 0">처음으로</button>';
  var note=isT||L.step!=="id"?"":App.pass&&App.scan?'<div class="note">QR을 찍었어요. 로그인하면 '+App.scan.period+'교시 도장이 찍혀요.</div>':'<div class="note">도장은 학교에서, 도장 찍는 시간에만 찍을 수 있어요. 학교를 벗어나면 찍히지 않아요. 시간에 맞춰 꿈실카페(1학년 꿈실카페1, 2학년 꿈실카페2)에 붙은 QR을 찍어야 찍혀요.</div>';
  var seg=L.step==="id"&&!App.pass?'<div class="seg"><button type="button" data-a="login-who" data-v="student" aria-pressed="'+!isT+'">학생</button><button type="button" data-a="login-who" data-v="teacher" aria-pressed="'+isT+'">선생님</button></div>':"";
  var hi=L.step==="id"&&!isT?woong("hi",'<b>안녕! 나는 웅이야</b>'+(App.pass&&App.scan?"로그인하면 "+App.scan.period+"교시 도장이 찍혀.":"도장은 학교에서, 도장 찍는 시간에만 찍을 수 있어. 학교를 벗어나면 안 찍혀.")):note;
  el("app").innerHTML=topBar(null,true)+heroHtml()+'<div class="wall" aria-hidden="true"></div><main class="login">'+sayingHtml()+seg+hi+
    '<div class="card"><form id="f-login" autocomplete="off" novalidate>'+E+body+'</form>'+back+'</div>'+
    '<p class="rule">'+esc(ruleText())+'</p>'+timesHtml()+motto()+'</main>';
  var first=document.querySelector("#f-login input");if(first&&!err)first.focus();
}
function timesHtml(nowNo){
  var c=App.conf;if(!c||!c.periods)return "";
  return '<table class="times"><thead><tr><th>교시</th><th>시간</th><th>도장 찍는 시간</th><th>도장</th></tr></thead><tbody>'+c.periods.map(function(p){
    return '<tr'+(nowNo===p.no?' class="now"':'')+'><td>'+p.no+'교시</td><td>'+esc(p.start)+'~'+esc(p.end)+'</td><td>'+esc(p.open)+'~'+esc(p.close)+'</td><td>'+p.n+'개</td></tr>';
  }).join("")+'</tbody></table>';
}
function submitLogin(){
  var L=App.login,isT=L.who==="teacher",v=function(id){var x=el(id);return x?x.value.trim():"";};
  if(L.step==="id"){
    if(isT){L.name=v("l-name");if(!L.name)return rLogin("이름을 넣어 주세요.");}
    else{L.hakbun=v("l-hb");L.name=v("l-name");if(!L.hakbun||!L.name)return rLogin("학번과 이름을 넣어 주세요.");}
    return tryLogin({});
  }
  var pin=v("l-pin");
  if(L.step==="setup"){var c0=function(id){var x=el(id);return !!(x&&x.checked);};L.ag={"l-a1":c0("l-a1"),"l-a2":c0("l-a2"),"l-a3":c0("l-a3")};}
  if(!/^\d{6}$/.test(pin))return rLogin("PIN은 숫자 여섯 자리예요.");
  if((L.step==="setup"||L.step==="code")&&pin!==v("l-pin2"))return rLogin("두 번 넣은 PIN이 달라요.");
  if(L.step==="setup"){
    var ck=function(id){var x=el(id);return !!(x&&x.checked);};
    L.ag={"l-a1":ck("l-a1"),"l-a2":ck("l-a2"),"l-a3":ck("l-a3")};
    if(!L.ag["l-a1"]||!L.ag["l-a2"]||!L.ag["l-a3"])return rLogin("동의서 세 항목에 모두 동의해 주세요.");
    return tryLogin({pin:pin,agree:true,agreeGeo:true,agreeDev:true});
  }
  if(L.step==="code"){var c=v("l-code").toUpperCase();if(!c)return rLogin("선생님 코드를 넣어 주세요.");return tryLogin({pin:pin,code:c});}
  tryLogin({pin:pin});
}
function tryLogin(extra){
  var L=App.login,isT=L.who==="teacher",p=isT?{name:L.name,device:deviceId()}:{hakbun:L.hakbun,name:L.name,pass:App.pass};
  Object.keys(extra).forEach(function(k){p[k]=extra[k];});
  var b=document.querySelector("#f-login .btn");if(b)b.disabled=true;
  call(isT?"tLogin":"login",p).then(function(r){
    if(r.token){
      if(isT){App.tch=r.token;put(K_TCH,r.token);App.login={who:"teacher",step:"id"};bootTeacher();}
      else{App.stu=r.token;put(K_STU,r.token);App.login={who:"student",step:"id"};if(App.pass)doCheckin();else bootPlain();}
      return;
    }
    L.step=r.step;L.name=r.name||L.name;rLogin();
  }).catch(function(e){rLogin(e.message);});
}
function logoutTeacher(msg){
  clearTimeout(App.qrT);App.tch=null;App.view=null;App.tab="stamp";App.data={};App.filter=null;App.q="";App.day=null;del(K_TCH);
  App.login={who:"teacher",step:"id"};rLogin(msg);

function logoutStudent(){

/* QR을 찍고 들어온 학생 */
function enterByQr(code){
  var gen=App.gen;
  call("scan",{q:code}).then(function(r){
    if(gen!==App.gen)return;
    App.conf=r.conf;App.g=r.g;App.notice=null;
    /* 도장 시간이 아니면 그냥 구경 */
    if(r.closed){App.pass=null;App.scan=null;return bootPlain();}
    App.pass=r.pass;App.scan=r;
    if(App.stu)return doCheckin();
    App.login={who:"student",step:"id"};rLogin();
  }).catch(function(e){
    if(gen!==App.gen)return;
    /* 지난 QR·시간 밖: 도장은 안 찍히고 구경 화면으로 간다 */
    if(e.kind==="qr"){App.pass=null;App.scan=null;App.warn=e.message+" 도장은 찍히지 않았어요.";return bootPlain();}
    el("app").innerHTML='<div class="loading">'+esc(e.message)+'</div>';

}
/* 위치를 한 번만 묻는다. 값은 서버 판단에만 쓰이고 어디에도 남지 않는다 */
function getPos(cb){
  if(App.fakeGeo==="deny")return cb(null,"위치 권한을 허용해야 도장을 찍을 수 있어요. 브라우저에서 위치를 허용한 뒤 다시 시도해 주세요.");
  if(App.fakeGeo)return cb(App.fakeGeo);
  if(!navigator.geolocation)return cb(null,"이 브라우저는 위치 확인을 지원하지 않아요. 폰의 기본 인터넷 앱으로 QR을 찍어 주세요.");
  navigator.geolocation.getCurrentPosition(function(p){
    cb({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy});
  },function(e){
    cb(null,e.code===1?"위치 권한을 허용해야 도장을 찍을 수 있어요. 브라우저에서 위치를 허용한 뒤 다시 시도해 주세요.":"위치를 찾지 못했어요. 창가로 옮겨 다시 시도해 주세요.");
  },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}
function doCheckin(){
  var gen=App.gen;
  el("app").innerHTML=topBar()+'<div class="loading">'+(App.conf&&App.conf.geo?"위치를 확인하는 중이에요…":"도장을 찍는 중이에요…")+'</div>';
  function send(pos){
    var p={device:deviceId()};
    if(pos){p.lat=pos.lat;p.lng=pos.lng;p.acc=pos.acc;}
    scall("checkin",p).then(function(r){
      if(gen!==App.gen)return;
      App.view=r.view;App.notice=r.result;rStudent();
    }).catch(function(e){if(gen===App.gen)rStop("도장을 찍지 못했어요",e.message,e.kind==="geo");});
  }
  if(!App.conf||!App.conf.geo)return send(null);
  getPos(function(pos,err){
    if(gen!==App.gen)return;
    if(!pos)return rStop("위치를 확인하지 못했어요",err,true);
    send(pos);
  });
}

var Q={jobs:[],busy:false};
function paintSaving(){var s=el("saving");if(s)s.textContent=(Q.jobs.length||Q.busy)?"저장 중…":"";}
function pump(){
  paintSaving();
  if(Q.busy||!Q.jobs.length)return;
  Q.busy=true;
  var first=Q.jobs[0],run;
  if(first.t==="stamp"){
    var batch=[];
    while(Q.jobs.length&&Q.jobs[0].t==="stamp"&&batch.length<40)batch.push(Q.jobs.shift());
    run=tcall("stamp",{items:batch.map(function(j){return {hakbun:j.h,date:j.d,period:j.p,n:j.n};})}).then(function(r){
      r.results.forEach(function(x,i){
        var j=batch[i],m=marks(j.d,j.p);
        if(x.ok)m[j.h]={id:x.id,t:x.t,m:x.m,n:x.n};
        else if(x.already){m[j.h]={id:x.id,t:x.t,m:x.m,n:x.n};toast("이미 도장이 있어요.");}
        else{delete m[j.h];toast(x.msg||"찍지 못했어요.");}
        paintCell(j.h,j.d,j.p);
      });
    }).catch(function(e){
      batch.forEach(function(j){delete marks(j.d,j.p)[j.h];paintCell(j.h,j.d,j.p);});
      toast(e.message);
    });
  }else{
    Q.jobs.shift();

function tapCell(h,d,no){
  var V=App.view,day=V.days.filter(function(x){return x.d===d;})[0],x=V.roster.filter(function(r){return r.h===h;})[0],M=marks(d,no),m=M[h],me=V.me.name;

    var by=m.m==="QR"?"QR로 찍은":m.t+" 선생님이 찍은";

function loadQrLib(cb){
  if(window.qrcode)return cb(true);
  var urls=["https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js","https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"],i=0;

    '<div id="q3-out" style="margin-top:8px">'+peopleStudents(st,q)+'</div></section>'+footer();
}
function peopleStudents(st,q){
  if(!q)return '<p class="hint">PIN을 잊은 학생을 찾아 초기화하면, 다음에 들어올 때 새로 정해요. 도장은 그대로 남아요.</p>';
  if(!st.length)return '<div class="empty">찾는 학생이 없어요.</div>';
  return '<div class="tw"><table class="t"><tbody>'+st.map(function(x){
    return '<tr><td><b class="tn">'+esc(x.n)+'</b><small class="ts">'+esc(x.c)+' · '+esc(x.h)+'</small></td><td class="r">'+(x.joined?'<button class="btn ghost sm" data-a="pin-reset" data-k="student" data-id="'+esc(x.h)+'" data-n="'+esc(x.n)+'">PIN 초기화</button>':'<span class="hint">아직 안 들어옴</span>')+'</td></tr>';
  }).join("")+'</tbody></table></div>';
}

/* ── 눌렀을 때 ── */
document.addEventListener("click",function(ev){
  var t=ev.target.closest&&ev.target.closest("[data-a]");if(!t)return;
  var a=t.getAttribute("data-a"),d=t.dataset;
  if(a==="login-back"){App.login={who:App.login.who,step:"id",hakbun:App.login.hakbun,name:App.login.name};return rLogin();}
  if(a==="login-who"){App.login={who:d.v,step:"id"};return rLogin();}
  if(a==="agree-all"){["l-a1","l-a2","l-a3"].forEach(function(id){var x=el(id);if(x)x.checked=true;});return;}
  if(a==="retry-checkin")return doCheckin();
  if(a==="to-home"){App.pass=null;App.scan=null;App.notice=null;return bootPlain();}
  if(a==="retry")return bootPlain();
  if(a==="logout")return logoutTeacher();
  if(a==="logout-stu")return logoutStudent();
  if(a==="tab"){clearTimeout(App.qrT);App.tab=d.v;App.data={};return rStaff();}
  if(a==="cell")return tapCell(d.h,d.d,Number(d.p));
  if(a==="day"){App.day=d.v;return paintSheet();}
  if(a==="f-mine"){App.filter={mode:"mine"};App.q="";return paintStamp();}
  if(a==="f-gp"){App.filter={mode:"gplan",grade:d.v};App.q="";saveFilter();return paintStamp();}
  if(a==="f-room"){App.filter={mode:"room",room:d.v};App.q="";saveFilter();return paintStamp();}
  if(a==="f-class"){var f0=filterNow();var mc=App.view.me.cls?App.view.me.cls.split("-"):[];App.filter={mode:"class",grade:f0.grade||mc[0]||gradesNow()[0]||"1",ban:f0.ban||mc[1]||"1"};App.q="";saveFilter();return paintStamp();}
  if(a==="f-grade"){App.filter.grade=d.v;App.filter.ban="1";saveFilter();return paintStamp();}
  if(a==="f-ban"){App.filter.ban=d.v;saveFilter();return paintStamp();}
  if(a==="f-plan"){App.onlyPlan=!App.onlyPlan;return paintStamp();}
if(a==="att-wk"){var aw0=(App.data.att&&App.data.att.wk)||"";var nd=new Date(Date.parse(aw0+"T00:00:00Z")+Number(d.v)*864e5);App.attWk=nd.toISOString().slice(0,10);App.data.att=null;return loadAtt(App.attWk);}
if(a==="pick-n"){App.stampN=Number(d.v)||0;try{localStorage.setItem("ungcheon-yaja-pickn",String(App.stampN));}catch(e){}return paintStamp();}
if(a==="f-came"){App.filter={mode:"came"};App.q="";return paintStamp();}
if(a==="f-extra"){App.filter={mode:"extra"};App.q="";return paintStamp();}
  if(a==="reload"){if(Q.busy||Q.jobs.length)return toast("저장이 끝나면 다시 눌러 주세요.");return loadWeek(App.view.wk);}
  if(a==="wk"){
    if(Q.busy||Q.jobs.length)return toast("저장이 끝나면 다시 눌러 주세요.");
    App.day=null;
    return loadWeek(addDays(App.view.wk,Number(d.v)));
  }
  if(a==="qr-g"){App.qrG=d.v;App.qrPicked=true;clearTimeout(App.qrT);return paintQr();}
  if(a==="qr-close"){if(!window.confirm(App.qrG+"학년 이번 교시 도장을 마감할까요? 학생은 더 이상 QR로 찍을 수 없어요(선생님은 표에서 찍을 수 있어요)."))return;t.disabled=true;return tcall("periodClose",{g:App.qrG}).then(function(){toast("마감했어요.");qrTick();}).catch(function(e){toast(e.message);t.disabled=false;});}
if(a==="qr-reopen"){if(!window.confirm("마감을 풀까요? 다시 QR로 찍을 수 있어요."))return;t.disabled=true;return tcall("periodReopen",{g:App.qrG}).then(function(){toast("마감을 풀었어요.");qrTick();}).catch(function(e){toast(e.message);t.disabled=false;});}
if(a==="qr-big"){var b=el("qrbox");b.classList.toggle("big");t.textContent=b.classList.contains("big")?"작게 보기":"크게 보기";return;}
  if(a==="gift-all"){App.giftAll=!App.giftAll;return paintGift();}
  if(a==="gift-csv")return giftCsv();
  if(a==="gift-pay"){
    if(!window.confirm(d.n+" 학생에게 상품권 "+d.q+"매를 준 것으로 기록할까요? 별 "+d.q+"개가 빠지고 도장은 남아요."))return;
    t.disabled=true;
    return tcall("giftPay",{hakbun:d.h}).then(function(r){toast(d.n+" 학생 "+r.qty+"매 배부 기록했어요.");paintTab();}).catch(function(e){toast(e.message);t.disabled=false;});
  }
  if(a==="gift-undo"){
    if(!window.confirm(d.n+" 학생의 배부 기록을 무를까요?"))return;
    t.disabled=true;
    return tcall("giftUndo",{id:d.id}).then(function(){toast("배부 기록을 물렀어요.");paintTab();}).catch(function(e){toast(e.message);t.disabled=false;});
  }
  if(a==="ros-clear"){
    if(!window.confirm(d.n+" 학생 신청을 모두 지울까요? 학생과 도장 기록은 남아요."))return;
    t.disabled=true;
    return tcall("rosterEdit",{op:"plan",hakbun:d.h,plan:[]}).then(function(){App.view.roster.forEach(function(x){if(x.h===d.h)x.p=[];});toast(d.n+" 학생 신청을 지웠어요.");paintRosList();paintRos();}).catch(function(e){toast(e.message);t.disabled=false;});
  }
  if(a==="ros-pick"){var qi=el("q5");if(qi){qi.value=d.h;paintRos();qi.scrollIntoView({block:"start",behavior:"smooth"});}return;}
  if(a==="pc"){t.setAttribute("aria-pressed",t.getAttribute("aria-pressed")==="true"?"false":"true");return;}
  if(a==="ros-add"){
    var rh=(el("ra-h").value||"").replace(/\D/g,""),rn=(el("ra-n").value||"").trim(),rp=pickedPlan("ra");
    if(!/^\d{4}$/.test(rh)){toast("학번 네 자리를 적어 주세요.");return;}
    var have=App.view.roster.filter(function(x){return x.h===rh;})[0];
    if(have){if(!rp.length){toast("신청할 교시를 골라 주세요.");return;}t.disabled=true;
      return tcall("rosterEdit",{op:"plan",hakbun:rh,plan:rp}).then(function(){have.p=rp;toast(have.n+" 학생 신청을 넣었어요.");el("ra-h").value="";el("ra-n").value="";
        Array.prototype.forEach.call(document.querySelectorAll('[data-a="pc"][data-g="ra"]'),function(b){b.setAttribute("aria-pressed","false");});t.disabled=false;paintRosList();}).catch(function(e){toast(e.message);t.disabled=false;});}
    if(!rn){toast("명단에 없는 학번이에요. 이름도 적어 주세요.");return;}
    t.disabled=true;
    return tcall("rosterEdit",{op:"add",hakbun:rh,name:rn,plan:rp}).then(function(r){
      App.view.roster.push({h:rh,n:rn,c:rh.charAt(0)+"-"+Number(rh.charAt(1)),p:rp,d:false,r:[]});
      toast(rn+" 학생을 "+(r&&r.revived?"되살렸어요.":"명단에 더했어요."));el("ra-h").value="";el("ra-n").value="";
      Array.prototype.forEach.call(document.querySelectorAll('[data-a="pc"][data-g="ra"]'),function(b){b.setAttribute("aria-pressed","false");});t.disabled=false;paintRosList();
    }).catch(function(e){toast(e.message);t.disabled=false;});
  }
  if(a==="ros-save"){
    var sp=pickedPlan("r"+d.h);t.disabled=true;
    return tcall("rosterEdit",{op:"plan",hakbun:d.h,plan:sp}).then(function(){
      App.view.roster.forEach(function(x){if(x.h===d.h)x.p=sp;});toast(d.n+" 학생 신청을 저장했어요.");t.disabled=false;paintRosList();
    }).catch(function(e){toast(e.message);t.disabled=false;});
  }
  if(a==="ros-del"){
    if(!window.confirm(d.n+" 학생을 명단에서 뺄까요? 도장·상품권 기록은 남고, 다시 더하면 되살아나요."))return;
    t.disabled=true;
    return tcall("rosterEdit",{op:"del",hakbun:d.h}).then(function(){
      App.view.roster=App.view.roster.filter(function(x){return x.h!==d.h;});toast(d.n+" 학생을 명단에서 뺐어요.");paintRos();paintRosList();
    }).catch(function(e){toast(e.message);t.disabled=false;});
  }
  if(a==="dev-reset"){
    if(!window.confirm(d.n+" 학생의 폰 등록을 풀까요?"))return;
    t.disabled=true;
    return tcall("deviceReset",{hakbun:d.h}).then(function(){
      App.view.roster.forEach(function(x){if(x.h===d.h)x.d=false;});
      toast("풀었어요. 다음에 찍는 폰이 새 내 폰이 돼요.");paintDev();
    }).catch(function(e){toast(e.message);t.disabled=false;});
  }
  if(a==="t-dev-reset"){
    if(!window.confirm(d.n+" 선생님의 기기 등록을 모두 풀까요? 다음에 로그인하는 기기부터 다시 등록돼요."))return;
    t.disabled=true;
    return tcall("tDevReset",{name:d.n}).then(function(){toast("기기 등록을 풀었어요.");paintTab();}).catch(function(e){toast(e.message);t.disabled=false;});
  }
  if(a==="pin-reset"){
    if(!window.confirm(d.n+"의 PIN을 초기화할까요?"))return;
    t.disabled=true;
    return tcall("pinReset",{kind:d.k,id:d.id}).then(function(){toast("초기화했어요. 다음에 들어올 때 새로 정해요.");paintTab();}).catch(function(e){toast(e.message);t.disabled=false;});
  }
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.getAttribute&&t.getAttribute("data-a")==="t-grade"){
    var pv=t.value.split("|");
    tcall("teacherSet",{name:t.dataset.n,grade:pv[0],year:pv[1]}).then(function(){toast(t.dataset.n+" 선생님 담당을 바꿨어요.");}).catch(function(e){toast(e.message);paintTab();});
  }
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="q"){App.q=t.value;paintSheet();}
  if(t.id==="q4")paintDev();
  if(t.id==="q5")paintRos();
  if(t.id==="q2"){App.q2=t.value.replace(/\s/g,"");var pos=t.selectionStart;paintGift();var n=el("q2");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}}
  if(t.id==="q3"){App.q3=t.value;var P=App.data.people,q=t.value.replace(/\s/g,"");el("q3-out").innerHTML=peopleStudents(q?P.students.filter(function(x){return x.h.indexOf(q)>=0||x.n.indexOf(q)>=0;}).slice(0,20):[],q);}
});
document.addEventListener("submit",function(ev){
  ev.preventDefault();
  if(ev.target.id==="f-login")return submitLogin();
  if(ev.target.id==="f-pin"){
    var o=el("p-old").value.trim(),n=el("p-new").value.trim(),n2=el("p-new2").value.trim();
    if(!/^\d{6}$/.test(n))return toast("새 PIN은 숫자 여섯 자리로 정해 주세요.");
    if(n!==n2)return toast("두 번 넣은 새 PIN이 달라요.");
    var isStu=App.view&&App.view.kind==="student";
    (isStu?scall:tcall)("pinChange",{old:o,pin:n}).then(function(r){
      if(isStu){App.stu=r.token;put(K_STU,r.token);}else{App.tch=r.token;put(K_TCH,r.token);}
      toast("PIN을 바꿨어요.");ev.target.closest("details").open=false;ev.target.reset();
    }).catch(function(e){toast(e.message);});
  }
});
/* 저장 중에 창을 닫으면 알린다 */
window.addEventListener("beforeunload",function(e){if(Q.busy||Q.jobs.length){e.preventDefault();e.returnValue="";}});

/* 학생이 앱으로 돌아오면 새 도장과 도장 시간을 다시 보여 준다 */
var lastBack=0;
document.addEventListener("visibilitychange",function(){
  if(document.hidden||!App.view||App.view.kind!=="student"||Date.now()-lastBack<30000)return;
  lastBack=Date.now();
  call("boot",{token:App.stu}).then(function(r){if(r.view&&r.view.kind==="student"){App.conf=r.conf;App.view=r.view;rStudent();}}).catch(function(){});
});
/* 시연본에서 계정을 바꿀 때 쓴다 */
window.appEnter=function(o){
  clearTimeout(App.qrT);
  App.gen++;
  App.fakeGeo=o.geo||null;App.dev=o.device||null;App.tch=o.tch||null;App.stu=o.stu||null;App.pass=null;App.scan=null;App.warn="";App.view=null;App.data={};App.tab="stamp";App.filter=null;App.q="";App.day=null;App.notice=null;App.g="";
  if(o.q!==undefined)return enterByQr(o.q);
  bootPlain();
};

/* 주소에 QR 값이 있으면 학생, 없으면 선생님 */
function start(params){
  App.g=/^[12]$/.test(params.g||"")?params.g:"";
  if(App.g)App.qrG=App.g;
  /* 선생님용 링크(?t=1): 로그인 화면을 선생님 칸으로 연다 */
  App.wantT=params.t==="1";
  App.stu=get(K_STU);App.tch=get(K_TCH);
  if(params.q)return enterByQr(params.q);
  bootPlain();
}
if(window.DemoServer)DemoServer.start();
else if(window.google&&google.script&&google.script.url)google.script.url.getLocation(function(l){start(l.parameter||{});});
else start({});
</script>
